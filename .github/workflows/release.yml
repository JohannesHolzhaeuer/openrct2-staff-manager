name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tsc

      - name: Write tag message to file
        id: tag_message
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > release_body.md

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/staff-manager.js
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
