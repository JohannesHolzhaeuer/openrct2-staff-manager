name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tsc

      - name: Read tag message
        id: tag_message
        run: |
          {
            echo "body<<EOF"
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/staff-manager.js
          body: ${{ steps.tag_message.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
