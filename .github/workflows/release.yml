name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # release-please is configured with "draft": true, so the GitHub
      # Release it creates is a draft - and GitHub does not create the
      # underlying git tag ref for a draft release until it's published.
      # Checking out "$TAG_NAME" here would therefore fail (the ref doesn't
      # exist yet). This workflow only runs on push to main though, and the
      # release-please PR has already been merged to main by that point, so
      # the release commit is simply the current HEAD.
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle plugin
        run: npm run bundle

      - name: Upload plugin asset to release
        run: gh release upload "$TAG_NAME" dist/staff-manager.js --repo "$GITHUB_REPOSITORY" --clobber

      - name: Rewrite release notes
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > release-notes-body.md

          {
            echo "## OpenRCT2 Staff Manager $TAG_NAME"
            echo ""
            echo "Automated release of the Staff Manager plugin."
            echo ""
            cat release-notes-body.md
            echo ""
            echo "## Installation"
            echo ""
            echo "1. Download \`staff-manager.js\` from the assets below."
            echo "2. Copy it into your OpenRCT2 \`plugin\` folder."
            echo "3. Restart OpenRCT2 (or reload plugins) to pick up the new version."
          } > release-notes.md

          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

      # release-please names the release after the package ("staff-manager:
      # v1.2.3"). The component is already omitted from the tag, so rename the
      # release to match the tag and keep the release list consistent.
      - name: Rename release to the plain tag
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME"

      - name: Publish release
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
